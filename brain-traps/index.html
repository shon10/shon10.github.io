42}, {"n": 22, "video": "trap-58.mp4", "q": "Which ball is bigger, the front one or the back one?", "options": ["Front", "Back", "Same"], "right": "Same", "answer": "Neither. same size.", "why": "Your brain reads the hallway as depth and scales up anything it thinks is far away, so the back ball looks bigger though both are drawn the same size (the Ponzo illusion).", "pause": 6.58}, {"n": 23, "video": "trap-59.mp4", "q": "Are these two dots taking turns to light up?", "options": ["Yes", "No"], "right": "No", "answer": "No. perfectly in sync.", "why": "Both dots get lighter and darker together. On black, a dot stands out most when it is light; on white, when it is dark, so the pair seem to take turns (induced contrast asynchrony).", "pause": 6.17}, {"n": 24, "video": "trap-60.mp4", "q": "Is the wheel spinning backwards?", "options": ["Yes", "No"], "right": "No", "answer": "No. forwards, very fast.", "why": "The wheel turns almost one spoke-gap every frame, so each frame shows the spokes just short of where they were and it seems to roll backwards.", "pause": 5.5}, {"n": 25, "video": "trap-61.mp4", "q": "Are the two rows the same?", "options": ["Yes", "No"], "right": "Yes", "answer": "Yes. one is upside down.", "why": "Your brain assumes light comes from above, so a circle that is light on top reads as a bump and one light at the bottom as a dent. The bottom row is the top row turned upside down.", "pause": 7.38}, {"n": 26, "video": "trap-62.mp4", "q": "Which red line is longer, left or right?", "options": ["Left", "Right", "Same"], "right": "Same", "answer": "Neither. same length.", "why": "The two red lines are exactly the same length. The big parallelogram around the left one makes it look much longer (the Sander illusion).", "pause": 6.26}, {"n": 27, "video": "trap-63.mp4", "q": "Are these four lines moving on their own?", "options": ["Yes", "No"], "right": "No", "answer": "No. one shape going round.", "why": "With the corners hidden, each edge only shows motion across itself, so one shape moving in a circle looks like four separate lines.", "pause": 6.12}, {"n": 28, "video": "trap-64.mp4", "q": "Is the black and white line a spiral?", "options": ["Yes", "No"], "right": "No", "answer": "No. separate circles.", "why": "The black and white line is really separate rings, each a perfect circle round the centre; the slanted stripes in each ring make them look like one spiral (the Fraser spiral). The green background pattern is twisted on purpose to strengthen the effect.", "pause": 5.91}, {"n": 29, "video": "trap-65.mp4", "q": "Are these two blocks taking turns to move?", "options": ["Yes", "No"], "right": "No", "answer": "No. same steady speed.", "why": "Both blocks slide at the same steady speed. Over the stripes, each block's edges keep switching between high and low contrast, and low contrast looks slower, so they seem to step in turn like feet (the footsteps illusion).", "pause": 6.2}, {"n": 30, "video": "trap-66.mp4", "q": "One coin rolls once around another. How many times does it turn?", "options": ["1", "2", "3"], "right": "2", "answer": "Two. not one.", "why": "A coin rolling once around an identical coin turns twice: once for the distance its edge rolls, and once more because its path goes all the way round (the coin rotation paradox).", "pause": 7.32}, {"n": 31, "video": "trap-67.mp4", "q": "Is the blue square growing and shrinking?", "options": ["Yes", "No"], "right": "No", "answer": "No. it only turns.", "why": "A blue square of fixed size turns slowly behind four orange blocks. With only the middle of its edges showing, it seems to swell and shrink.", "pause": 5.84}, {"n": 32, "video": "trap-68.mp4", "q": "Is the orange circle changing size?", "options": ["Yes", "No"], "right": "No", "answer": "No. it never changes.", "why": "The orange circle never changes. The grey circles around it grow and shrink, so it seems to shrink and grow against them (the dynamic Ebbinghaus illusion).", "pause": 5.98}, {"n": 33, "video": "trap-69.mp4", "q": "Is this window swinging back and forth?", "options": ["Yes", "No"], "right": "No", "answer": "No. it spins all the way round.", "why": "The window is a flat trapezoid turning steadily. Your brain reads the tall end as the near end, so it seems to swing back and forth instead of going round (the Ames window).", "pause": 6.02}, {"n": 34, "video": "trap-70.mp4", "q": "Is the grey square changing color?", "options": ["Yes", "No"], "right": "No", "answer": "No. same grey all the way.", "why": "The square never changes. Over the dark end of the background it looks light; over the light end it looks dark (simultaneous contrast).", "pause": 5.74}, {"n": 35, "video": "trap-71.mp4", "q": "How many things are moving here?", "options": ["1", "2", "4"], "right": "1", "answer": "One. a hidden square.", "why": "Only one thing moves: a square outline going round a small circle. Its corners are hidden behind patches the same colour as the background, so you only see the middle of each edge, and each edge seems to slide about on its own (the aperture problem).", "pause": 5.6}, {"n": 36, "video": "trap-72.mp4", "q": "Which ring is turning clockwise, the inner one or the outer one?", "options": ["Inner", "Outer", "Neither"], "right": "Neither", "answer": "Neither. nothing turns.", "why": "The two rings of tilted squares only grow and shrink together; nothing rotates. Because the squares in the two rings lean opposite ways, zooming makes the rings seem to turn in opposite directions (the Pinna-Brelstaff illusion).", "pause": 7.32}, {"n": 37, "video": "trap-73.mp4", "q": "How much does the green square grow: 0%, 10% or 20%?", "options": ["0%", "10%", "20%"], "right": "0%", "answer": "0%. it only turns.", "why": "A green square of fixed size turns slowly behind four purple blocks. With only the middle of its edges showing, it seems to swell and shrink, but its size never changes.", "pause": 7.94}, {"n": 38, "video": "trap-74.mp4", "q": "Are the grey lines waving up a red lines bending?", "options": ["Yes", "No"], "right": "No", "answer": "No. dead straight.", "why": "The two red lines are perfectly straight and never move. Only the fan of rays behind them moves up and down, and the rays make the straight lines seem to bow and flex (the Hering illusion).", "pause": 5.55}];
const SIGNUP_URL = "";   // set to a mailing-list form endpoint (e.g. Buttondown / Mailchimp / Formspree) to show the email box
const BASE = location.hostname === "shon10.github.io" ? "" : "https://shon10.github.io/brain-traps/";
const KEY = "bt-results-v1";
const $ = (id) => document.getElementById(id);
const v = $("v");
let results = {};
try { results = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { results = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(results)); } catch (e) {} };
let cur = 0, asked = false, answered = false, raf = 0;

function firstUnplayed() { const i = LEVELS.findIndex((l) => !(l.n in results)); return i < 0 ? 0 : i; }
function fromHash() { const n = parseInt(location.hash.slice(1), 10); const i = LEVELS.findIndex((l) => l.n === n); return i >= 0 ? i : null; }

function renderScore() {
  const done = Object.keys(results).length, passed = Object.values(results).filter(Boolean).length;
  $("score").innerHTML = done ? `Passed <b>${passed}</b> of <b>${done}</b> played · ${LEVELS.length} levels so far` : `${LEVELS.length} levels so far. How far can you get?`;
}
function renderGrid() {
  $("grid").innerHTML = "";
  LEVELS.forEach((l, i) => {
    const b = document.createElement("button");
    b.className = "cell" + (l.n in results ? (results[l.n] ? " good" : " bad") : "") + (i === cur ? " now" : "");
    b.textContent = l.n; b.setAttribute("aria-label", `Level ${l.n}`);
    b.onclick = () => { load(i); window.scrollTo({ top: 0, behavior: "smooth" }); };
    $("grid").appendChild(b);
  });
}
function load(i, autoplay = false) {
  cur = Math.max(0, Math.min(LEVELS.length - 1, i));
  const l = LEVELS[cur];
  asked = false; answered = false; cancelAnimationFrame(raf);
  v.pause(); v.src = BASE + l.video + "#t=0.1";
  $("lv").textContent = `Level ${l.n}`;
  $("play").textContent = `▶ Play Level ${l.n}`;
  $("start").classList.toggle("on", !autoplay);
  $("ask").classList.remove("on");
  $("verdict").className = "verdict";
  $("why").classList.remove("on"); $("why").open = false; $("whytext").textContent = l.why;
  $("next").disabled = cur === LEVELS.length - 1;
  history.replaceState(null, "", "#" + l.n);
  renderGrid(); renderScore();
  if (autoplay) play();
}
function due() {   // pause just before the answer; checked from three sources so a busy browser can't overshoot
  if (!asked && v.currentTime >= LEVELS[cur].pause) { v.pause(); ask(); return true; }
  return false;
}
function watch() {
  if (due()) return;
  if (!v.paused && !v.ended) raf = requestAnimationFrame(watch);
}
function onFrame() { if (!due() && !v.paused && !v.ended && v.requestVideoFrameCallback) v.requestVideoFrameCallback(onFrame); }
v.addEventListener("timeupdate", due);
v.addEventListener("playing", () => { if (!asked && v.requestVideoFrameCallback) v.requestVideoFrameCallback(onFrame); });
function play() {
  $("start").classList.remove("on");
  if (!asked) { try { v.currentTime = 0; } catch (e) {} }
  v.play().then(() => { raf = requestAnimationFrame(watch); }).catch(() => $("start").classList.add("on"));
}
function ask() {
  asked = true;
  const l = LEVELS[cur];
  $("askq").textContent = l.q;
  $("opts").innerHTML = "";
  l.options.forEach((o) => {
    const b = document.createElement("button"); b.className = "btn opt"; b.textContent = o;
    b.onclick = () => choose(o); $("opts").appendChild(b);
  });
  $("ask").classList.add("on");
}
function choose(o) {
  const l = LEVELS[cur], ok = o === l.right;
  if (!(l.n in results)) { results[l.n] = ok; save(); }
  answered = true;
  $("ask").classList.remove("on");
  const vd = $("verdict");
  vd.textContent = ok ? "✓ You got it" : `✗ Fooled you: ${l.right}`; vd.className = "verdict " + (ok ? "good" : "bad");
  setTimeout(() => { vd.className = "verdict"; }, 2600);
  $("why").classList.add("on");
  v.play().catch(() => {});
  renderGrid(); renderScore();
}
v.addEventListener("ended", () => { if (answered) $("next").focus({ preventScroll: true }); });
v.addEventListener("play", () => { if (!asked) raf = requestAnimationFrame(watch); });
$("play").onclick = play;
$("replay").onclick = () => load(cur, true);
$("next").onclick = () => load(cur + 1, true);
window.addEventListener("hashchange", () => { const i = fromHash(); if (i !== null && i !== cur) load(i); });

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 2200); }
$("share").onclick = async () => {
  const passed = Object.values(results).filter(Boolean).length, played = Object.keys(results).length;
  const text = played ? `I passed ${passed} of ${played} Brain Traps. Can you beat me?` : "100 brain traps. Most people fail by Level 5.";
  const url = location.origin + location.pathname;
  try { if (navigator.share) { await navigator.share({ title: "Brain Traps", text, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast("Copied. Paste it to a friend."); } catch (e) { toast(url); }
};
if (SIGNUP_URL) { const f = $("signup"); f.action = SIGNUP_URL; f.classList.add("on"); }

const h = fromHash(); load(h !== null ? h : firstUnplayed());
</script>
</body>
</html>
